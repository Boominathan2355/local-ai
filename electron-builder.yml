appId: com.localai.assistant
productName: local-ai-assistant
executableName: local-ai-assistant
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron/*'
  - '!llama/**/*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,electron.vite.config.ts}'
linux:
  target:
    - deb
  maintainer: localai
  category: Utility
  icon: build/icon.png
deb:
  artifactName: "${productName}.${ext}"
  afterInstall: build/postinst
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
